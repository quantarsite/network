<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@500;700&display=swap" rel="stylesheet">
<style>
  .qn-nav{position:fixed;top:0;left:0;right:0;z-index:2000;background:rgba(6,8,15,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid #161d2e;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.4;box-sizing:border-box}
  .qn-nav *,.qn-nav *::before,.qn-nav *::after{box-sizing:border-box}
  .qn-nav .qn-inner{max-width:1240px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .qn-nav a.qn-logo{font-weight:700;font-size:18px;letter-spacing:-.02em;color:#f0f2f5;text-decoration:none;white-space:nowrap;padding:0;margin:0;background:none;border:0}
  .qn-nav a.qn-logo span{background:linear-gradient(135deg,#00e5ff,#b24bf3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .qn-nav .qn-links{display:flex;align-items:center;gap:2px;margin:0;padding:0}
  .qn-nav a.qn-link{display:block;color:#8b93a3;text-decoration:none;font-size:13px;font-weight:500;letter-spacing:0;text-transform:none;padding:7px 9px;border-radius:6px;border:0;background:none;white-space:nowrap;transition:color .2s,background .2s}
  .qn-nav a.qn-link:hover{color:#f0f2f5;background:rgba(255,255,255,.06)}
  .qn-nav a.qn-link[aria-current="page"]{color:#00e5ff}
  .qn-nav a.qn-cta{margin-left:8px;color:#06080f;background:linear-gradient(135deg,#00e5ff,#b24bf3);font-weight:700}
  .qn-nav a.qn-cta:hover{color:#06080f;opacity:.9;background:linear-gradient(135deg,#00e5ff,#b24bf3)}
  .qn-nav a.qn-cta[aria-current="page"]{color:#06080f}
  .qn-nav button.qn-toggle{display:none;align-items:center;justify-content:center;width:44px;height:44px;margin:0 -8px 0 0;padding:0;background:none;border:0;border-radius:8px;color:#f0f2f5;font-size:24px;line-height:1;cursor:pointer;font-family:inherit}
  .qn-nav button.qn-toggle:focus-visible,.qn-nav a.qn-link:focus-visible{outline:2px solid #00e5ff;outline-offset:2px}
  .qn-nav-spacer{height:64px}
  @media (max-width:1100px){
    .qn-nav button.qn-toggle{display:flex}
    .qn-nav .qn-links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;padding:8px 12px 16px;background:rgba(6,8,15,.98);border-bottom:1px solid #161d2e;max-height:calc(100vh - 64px);overflow-y:auto}
    .qn-nav.qn-open .qn-links{display:flex}
    .qn-nav a.qn-link{font-size:16px;padding:13px 12px}
    .qn-nav a.qn-cta{margin:8px 0 0;text-align:center}
  }
</style>
<div class="qn-nav" role="navigation" aria-label="Main">
  <div class="qn-inner">
    <a class="qn-logo" href="/"><span>Quantar</span> Network</a>
    <button class="qn-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="qn-links">&#9776;</button>
    <div class="qn-links" id="qn-links">
        {{LINKS}}
        {{CTA}}
    </div>
  </div>
</div>
{{SPACER}}
<script>
(function () {
  var nav = document.querySelector('.qn-nav');
  if (!nav) return;
  var btn = nav.querySelector('.qn-toggle');
  function set(open) {
    nav.classList.toggle('qn-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    btn.innerHTML = open ? '&#10005;' : '&#9776;';
  }
  btn.addEventListener('click', function () { set(!nav.classList.contains('qn-open')); });
  nav.querySelectorAll('.qn-link').forEach(function (a) { a.addEventListener('click', function () { set(false); }); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
  document.addEventListener('click', function (e) { if (!nav.contains(e.target)) set(false); });
})();
</script>
