<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Quantar Network — Investor Data Room</title>
<meta name="robots" content="noindex, nofollow">
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;700;900&family=Syne:wght@300;400;600&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
:root {
  --bg:      #03030f;
  --cyan:    #00f5ff;
  --purple:  #b800ff;
  --gold:    #f0c060;
  --text:    #e8f4f8;
  --muted:   rgba(232,244,248,0.45);
  --border:  rgba(0,245,255,0.15);
  --card:    rgba(0,245,255,0.04);
  --glow:    rgba(0,245,255,0.3);
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Syne', sans-serif;
  min-height: 100vh;
  overflow-x: hidden;
}

/* ── Background ────────────────────────────────────────────────────────────── */
.bg-grid {
  position: fixed; inset: 0; z-index: 0;
  background-image:
    linear-gradient(rgba(0,245,255,0.035) 1px, transparent 1px),
    linear-gradient(90deg, rgba(0,245,255,0.035) 1px, transparent 1px);
  background-size: 56px 56px;
  pointer-events: none;
}

.bg-glow {
  position: fixed; z-index: 0;
  top: -30%; left: 50%; transform: translateX(-50%);
  width: 1000px; height: 800px;
  background: radial-gradient(ellipse, rgba(0,245,255,0.05) 0%, rgba(184,0,255,0.04) 45%, transparent 70%);
  pointer-events: none;
}

/* ── Lock screen ───────────────────────────────────────────────────────────── */
#lockScreen {
  position: fixed; inset: 0; z-index: 100;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg);
  animation: fadeIn 0.5s ease;
}

.lock-box {
  width: 100%; max-width: 420px;
  padding: 48px 40px;
  background: rgba(0,245,255,0.04);
  border: 1px solid rgba(0,245,255,0.2);
  border-radius: 16px;
  text-align: center;
  position: relative;
  margin: 24px;
}

.lock-box::before {
  content: '';
  position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), var(--purple), transparent);
}

.lock-icon {
  font-size: 2.5rem;
  margin-bottom: 20px;
  display: block;
  filter: drop-shadow(0 0 12px var(--cyan));
}

.lock-title {
  font-family: 'Orbitron', monospace;
  font-size: 1.1rem;
  font-weight: 700;
  letter-spacing: 0.15em;
  color: var(--cyan);
  margin-bottom: 6px;
  text-transform: uppercase;
}

.lock-sub {
  font-size: 0.8rem;
  color: var(--muted);
  letter-spacing: 0.1em;
  margin-bottom: 32px;
}

.lock-input {
  width: 100%;
  background: rgba(0,0,0,0.6);
  border: 1px solid var(--border);
  border-radius: 8px;
  color: var(--text);
  font-family: 'Share Tech Mono', monospace;
  font-size: 1rem;
  padding: 14px 18px;
  letter-spacing: 0.2em;
  outline: none;
  text-align: center;
  margin-bottom: 16px;
  transition: border-color 0.25s, box-shadow 0.25s;
}

.lock-input:focus {
  border-color: var(--cyan);
  box-shadow: 0 0 0 2px rgba(0,245,255,0.1), 0 0 20px rgba(0,245,255,0.08);
}

.lock-btn {
  width: 100%;
  background: transparent;
  border: 1px solid var(--cyan);
  border-radius: 8px;
  color: var(--cyan);
  font-family: 'Orbitron', monospace;
  font-size: 0.8rem;
  font-weight: 700;
  letter-spacing: 0.2em;
  padding: 14px;
  cursor: pointer;
  text-transform: uppercase;
  transition: background 0.25s, box-shadow 0.25s;
  margin-bottom: 12px;
}

.lock-btn:hover {
  background: rgba(0,245,255,0.08);
  box-shadow: 0 0 20px var(--glow);
}

.lock-error {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.75rem;
  color: #ff6060;
  letter-spacing: 0.1em;
  min-height: 20px;
  margin-top: 4px;
}

.lock-contact {
  margin-top: 24px;
  font-size: 0.72rem;
  color: var(--muted);
  letter-spacing: 0.08em;
}

.lock-contact a { color: var(--cyan); text-decoration: none; }

/* ── Main content ──────────────────────────────────────────────────────────── */
#dataRoom {
  display: none;
  position: relative; z-index: 1;
  max-width: 1080px;
  margin: 0 auto;
  padding: 48px 28px 100px;
}

/* ── Header ────────────────────────────────────────────────────────────────── */
.dr-header {
  display: flex;
  align-items: flex-start;
  justify-content: space-between;
  gap: 24px;
  margin-bottom: 56px;
  padding-bottom: 32px;
  border-bottom: 1px solid var(--border);
  animation: fadeDown 0.7s ease both;
  flex-wrap: wrap;
}

.dr-brand {
  display: flex;
  align-items: center;
  gap: 14px;
}

.dr-logo {
  width: 48px; height: 48px; flex-shrink: 0;
}

.dr-brand-text h1 {
  font-family: 'Orbitron', monospace;
  font-size: 1.3rem;
  font-weight: 900;
  letter-spacing: 0.1em;
  background: linear-gradient(90deg, var(--cyan), var(--purple));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text;
  line-height: 1;
  margin-bottom: 4px;
}

.dr-brand-text p {
  font-size: 0.7rem;
  color: var(--muted);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  font-family: 'Share Tech Mono', monospace;
}

.dr-meta {
  text-align: right;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.72rem;
  color: var(--muted);
  letter-spacing: 0.08em;
  line-height: 1.8;
}

.dr-meta strong { color: var(--cyan); }

.confidential-badge {
  display: inline-flex;
  align-items: center;
  gap: 6px;
  background: rgba(240,192,96,0.08);
  border: 1px solid rgba(240,192,96,0.3);
  border-radius: 4px;
  padding: 4px 10px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem;
  color: var(--gold);
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 8px;
}

/* ── Section title ─────────────────────────────────────────────────────────── */
.section-label {
  font-family: 'Orbitron', monospace;
  font-size: 0.65rem;
  letter-spacing: 0.35em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
}

.section-label::after {
  content: ''; flex: 1; height: 1px;
  background: linear-gradient(90deg, var(--border), transparent);
}

/* ── KPI row ───────────────────────────────────────────────────────────────── */
.kpi-row {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 14px;
  margin-bottom: 48px;
  animation: fadeUp 0.7s 0.1s ease both;
}

.kpi-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 18px;
  position: relative;
  overflow: hidden;
  transition: border-color 0.3s, background 0.3s;
}

.kpi-card::before {
  content: '';
  position: absolute; top: 0; left: 0; right: 0; height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
  opacity: 0.4;
}

.kpi-card:hover {
  border-color: rgba(0,245,255,0.3);
  background: rgba(0,245,255,0.07);
}

.kpi-value {
  font-family: 'Orbitron', monospace;
  font-size: 1.4rem;
  font-weight: 700;
  color: var(--cyan);
  text-shadow: 0 0 20px var(--glow);
  line-height: 1;
  margin-bottom: 6px;
}

.kpi-value.gold { color: var(--gold); text-shadow: 0 0 20px rgba(240,192,96,0.4); }
.kpi-value.purple { color: #c060ff; text-shadow: 0 0 20px rgba(184,0,255,0.3); }

.kpi-label {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.66rem;
  color: var(--muted);
  letter-spacing: 0.12em;
  text-transform: uppercase;
  line-height: 1.5;
}

/* ── Documents grid ────────────────────────────────────────────────────────── */
.docs-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 16px;
  margin-bottom: 48px;
  animation: fadeUp 0.7s 0.2s ease both;
}

.doc-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 24px 20px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  text-decoration: none;
  color: inherit;
  position: relative;
  overflow: hidden;
  transition: border-color 0.25s, background 0.25s, transform 0.25s;
  cursor: pointer;
  pointer-events: all;
  z-index: 10;
}

.doc-card::after {
  content: '';
  position: absolute; inset: 0;
  background: linear-gradient(135deg, rgba(0,245,255,0.04), transparent);
  opacity: 0;
  transition: opacity 0.25s;
}

.doc-card:hover {
  border-color: rgba(0,245,255,0.35);
  background: rgba(0,245,255,0.06);
  transform: translateY(-2px);
}

.doc-card:hover::after { opacity: 1; }

.doc-icon {
  font-size: 1.8rem;
  line-height: 1;
}

.doc-title {
  font-family: 'Orbitron', monospace;
  font-size: 0.78rem;
  font-weight: 700;
  letter-spacing: 0.1em;
  color: var(--text);
  text-transform: uppercase;
  line-height: 1.3;
}

.doc-desc {
  font-size: 0.75rem;
  color: var(--muted);
  line-height: 1.6;
  flex: 1;
}

.doc-meta {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.65rem;
  color: var(--muted);
  letter-spacing: 0.1em;
  display: flex;
  align-items: center;
  gap: 8px;
}

.doc-tag {
  background: rgba(0,245,255,0.08);
  border: 1px solid rgba(0,245,255,0.2);
  border-radius: 3px;
  padding: 2px 8px;
  font-size: 0.6rem;
  color: var(--cyan);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

.doc-tag.gold-tag {
  background: rgba(240,192,96,0.08);
  border-color: rgba(240,192,96,0.25);
  color: var(--gold);
}

.doc-arrow {
  position: absolute; top: 20px; right: 20px;
  color: var(--cyan);
  opacity: 0;
  transition: opacity 0.25s, transform 0.25s;
  font-size: 0.9rem;
}

.doc-card:hover .doc-arrow { opacity: 1; transform: translate(2px, -2px); }

/* ── Raise table ───────────────────────────────────────────────────────────── */
.raise-section {
  margin-bottom: 48px;
  animation: fadeUp 0.7s 0.3s ease both;
}

.info-table {
  width: 100%;
  border-collapse: collapse;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.8rem;
}

.info-table tr {
  border-bottom: 1px solid rgba(0,245,255,0.07);
  transition: background 0.2s;
}

.info-table tr:hover { background: rgba(0,245,255,0.03); }
.info-table tr:last-child { border-bottom: none; }

.info-table td {
  padding: 14px 16px;
}

.info-table td:first-child {
  color: var(--muted);
  letter-spacing: 0.1em;
  text-transform: uppercase;
  font-size: 0.7rem;
  width: 40%;
}

.info-table td:last-child {
  color: var(--text);
  font-weight: 400;
}

.info-table td span.cyan { color: var(--cyan); }
.info-table td span.gold { color: var(--gold); }
.info-table td span.purple { color: #c060ff; }

/* ── Roadmap ───────────────────────────────────────────────────────────────── */
.roadmap-section {
  margin-bottom: 48px;
  animation: fadeUp 0.7s 0.35s ease both;
}

.roadmap-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 12px;
}

.rm-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px 16px;
  position: relative;
}

.rm-card.active {
  border-color: rgba(0,245,255,0.35);
  background: rgba(0,245,255,0.06);
}

.rm-card.active::before {
  content: '';
  position: absolute; top: 0; left: 15%; right: 15%; height: 1px;
  background: linear-gradient(90deg, transparent, var(--cyan), transparent);
}

.rm-phase {
  font-family: 'Orbitron', monospace;
  font-size: 0.6rem;
  letter-spacing: 0.25em;
  color: var(--muted);
  text-transform: uppercase;
  margin-bottom: 6px;
}

.rm-period {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.85rem;
  color: var(--cyan);
  margin-bottom: 12px;
  font-weight: bold;
}

.rm-card.active .rm-period { text-shadow: 0 0 12px var(--glow); }

.rm-items {
  list-style: none;
  font-size: 0.72rem;
  color: var(--muted);
  line-height: 2;
}

.rm-items li::before {
  content: '─ ';
  color: var(--cyan);
  opacity: 0.5;
}

.rm-badge {
  display: inline-block;
  margin-top: 10px;
  background: rgba(0,245,255,0.1);
  border: 1px solid rgba(0,245,255,0.25);
  border-radius: 3px;
  padding: 2px 8px;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.6rem;
  color: var(--cyan);
  letter-spacing: 0.15em;
  text-transform: uppercase;
}

/* ── Team ──────────────────────────────────────────────────────────────────── */
.team-section {
  margin-bottom: 48px;
  animation: fadeUp 0.7s 0.4s ease both;
}

.team-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 14px;
}

.team-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: 10px;
  padding: 20px;
  transition: border-color 0.3s;
}

.team-card:hover { border-color: rgba(0,245,255,0.3); }

.team-name {
  font-family: 'Orbitron', monospace;
  font-size: 0.8rem;
  font-weight: 700;
  color: var(--text);
  letter-spacing: 0.08em;
  margin-bottom: 4px;
}

.team-role {
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.7rem;
  color: var(--cyan);
  letter-spacing: 0.1em;
  margin-bottom: 10px;
}

.team-bio {
  font-size: 0.73rem;
  color: var(--muted);
  line-height: 1.65;
}

/* ── Footer ────────────────────────────────────────────────────────────────── */
.dr-footer {
  border-top: 1px solid var(--border);
  padding-top: 28px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-family: 'Share Tech Mono', monospace;
  font-size: 0.68rem;
  color: var(--muted);
  letter-spacing: 0.08em;
  flex-wrap: wrap;
  gap: 12px;
  animation: fadeUp 0.7s 0.5s ease both;
}

.dr-footer a { color: var(--cyan); text-decoration: none; opacity: 0.8; }
.dr-footer a:hover { opacity: 1; }

/* ── Animations ────────────────────────────────────────────────────────────── */
@keyframes fadeIn  { from { opacity: 0 } to { opacity: 1 } }
@keyframes fadeDown { from { opacity: 0; transform: translateY(-16px) } to { opacity: 1; transform: translateY(0) } }
@keyframes fadeUp  { from { opacity: 0; transform: translateY(14px) } to { opacity: 1; transform: translateY(0) } }

/* ── Responsive ────────────────────────────────────────────────────────────── */
@media (max-width: 900px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .docs-grid { grid-template-columns: repeat(2, 1fr); }
  .roadmap-grid { grid-template-columns: repeat(2, 1fr); }
  .team-grid { grid-template-columns: repeat(2, 1fr); }
}

@media (max-width: 560px) {
  .kpi-row { grid-template-columns: repeat(2, 1fr); }
  .docs-grid { grid-template-columns: 1fr; }
  .roadmap-grid { grid-template-columns: 1fr; }
  .team-grid { grid-template-columns: 1fr; }
  .dr-header { flex-direction: column; }
  .dr-meta { text-align: left; }
}
</style>
</head>

<style>
  .qn-nav{position:fixed;top:0;left:0;right:0;z-index:2000;background:rgba(6,8,15,.88);-webkit-backdrop-filter:blur(18px);backdrop-filter:blur(18px);border-bottom:1px solid #161d2e;font-family:'Outfit',system-ui,-apple-system,'Segoe UI',sans-serif;line-height:1.4;box-sizing:border-box}
  .qn-nav *,.qn-nav *::before,.qn-nav *::after{box-sizing:border-box}
  .qn-nav .qn-inner{max-width:1240px;margin:0 auto;padding:0 20px;height:64px;display:flex;align-items:center;justify-content:space-between;gap:16px}
  .qn-nav a.qn-logo{font-weight:700;font-size:18px;letter-spacing:-.02em;color:#f0f2f5;text-decoration:none;white-space:nowrap;padding:0;margin:0;background:none;border:0}
  .qn-nav a.qn-logo span{background:linear-gradient(135deg,#00e5ff,#b24bf3);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;color:transparent}
  .qn-nav .qn-links{display:flex;align-items:center;gap:2px;margin:0;padding:0}

  .qn-nav a.qn-link:hover{color:#f0f2f5;background:rgba(255,255,255,.06)}
  .qn-nav a.qn-link[aria-current="page"]{color:#00e5ff}
  .qn-nav a.qn-cta{margin-left:8px;color:#06080f;background:linear-gradient(135deg,#00e5ff,#b24bf3);font-weight:700}
  .qn-nav a.qn-cta:hover{color:#06080f;opacity:.9;background:linear-gradient(135deg,#00e5ff,#b24bf3)}
  .qn-nav a.qn-cta[aria-current="page"]{color:#06080f}
  .qn-nav button.qn-toggle{display:none;align-items:center;justify-content:center;width:44px;height:44px;margin:0 -8px 0 0;padding:0;background:none;border:0;border-radius:8px;color:#f0f2f5;font-size:24px;line-height:1;cursor:pointer;font-family:inherit}
  .qn-nav button.qn-toggle:focus-visible,.qn-nav a.qn-link:focus-visible{outline:2px solid #00e5ff;outline-offset:2px}
  .qn-nav-spacer{height:64px}
  @media (max-width:1100px){
    .qn-nav button.qn-toggle{display:flex}
    .qn-nav .qn-links{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;align-items:stretch;gap:0;padding:8px 12px 16px;background:rgba(6,8,15,.98);border-bottom:1px solid #161d2e;max-height:calc(100vh - 64px);overflow-y:auto}
    .qn-nav.qn-open .qn-links{display:flex}
    .qn-nav a.qn-link{font-size:16px;padding:13px 12px}

  }
</style>
<div class="qn-nav" role="navigation" aria-label="Main">
  <div class="qn-inner">
    <a class="qn-logo" href="/"><span>Quantar</span> Network</a>
    <button class="qn-toggle" type="button" aria-label="Open menu" aria-expanded="false" aria-controls="qn-links">&#9776;</button>
    <div class="qn-links" id="qn-links">
        <a class="qn-link" href="/">Home</a>
        <a class="qn-link" href="/technology">Technology</a>
        <a class="qn-link" href="/hydrax">HYDRA-X</a>
        <a class="qn-link" href="/benchmark">Benchmark</a>
        <a class="qn-link" href="/whitepaper">Whitepaper</a>
        <a class="qn-link" href="/article">Article</a>
        <a class="qn-link" href="/testnet">Testnet</a>
        <a class="qn-link" href="/monitor">Monitor</a>
        <a class="qn-link" href="/professionalteam">Team</a>
        <a class="qn-link" href="/cashbook">Cash Book</a>
        <a class="qn-link qn-cta" href="/invest" aria-current="page">Invest</a>
    </div>
  </div>
</div>
<div class="qn-nav-spacer" aria-hidden="true"></div>
<script>
(function () {
  var nav = document.querySelector('.qn-nav');
  if (!nav) return;
  var btn = nav.querySelector('.qn-toggle');
  function set(open) {
    nav.classList.toggle('qn-open', open);
    btn.setAttribute('aria-expanded', open ? 'true' : 'false');
    btn.setAttribute('aria-label', open ? 'Close menu' : 'Open menu');
    btn.innerHTML = open ? '&#10005;' : '&#9776;';
  }
  btn.addEventListener('click', function () { set(!nav.classList.contains('qn-open')); });
  nav.querySelectorAll('.qn-link').forEach(function (a) { a.addEventListener('click', function () { set(false); }); });
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') set(false); });
  document.addEventListener('click', function (e) { if (!nav.contains(e.target)) set(false); });
})();
</script>

<!-- ── LOCK SCREEN ──────────────────────────────────────────────────────────── -->
<div id="lockScreen">
  <div class="lock-box">
    <span class="lock-icon">⬡</span>
    <div class="lock-title">Investor Data Room</div>
    <div class="lock-sub">QUANTAR NETWORK &nbsp;·&nbsp; CONFIDENTIAL</div>
    <input type="password" class="lock-input" id="passInput" placeholder="ACCESS CODE" maxlength="32" autocomplete="off">
    <button class="lock-btn" onclick="unlock()">AUTHENTICATE</button>
    <div class="lock-error" id="lockError"></div>

<script>
// Decifra o dataroom no navegador. A senha nunca sai do aparelho de quem digita.
(function () {
  const $ = (id) => document.getElementById(id);
  const payload = JSON.parse($('drPayload').textContent);
  const unb64 = (s) => Uint8Array.from(atob(s), (c) => c.charCodeAt(0));
  const KEY_STORE = 'dr_key_v' + payload.v + '_' + payload.salt;

  async function deriveRaw(password) {
    const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(password), 'PBKDF2', false, ['deriveBits']);
    return new Uint8Array(await crypto.subtle.deriveBits(
      { name: 'PBKDF2', hash: 'SHA-256', salt: unb64(payload.salt), iterations: payload.iter }, base, 256));
  }

  async function open(raw) {
    const key = await crypto.subtle.importKey('raw', raw, 'AES-GCM', false, ['decrypt']);
    const plain = await crypto.subtle.decrypt({ name: 'AES-GCM', iv: unb64(payload.iv) }, key, unb64(payload.ct));
    const data = JSON.parse(new TextDecoder().decode(plain));
    const room = $('dataRoom');
    room.innerHTML = data.html;
    room.querySelectorAll('a[href$=".pdf"]').forEach((a) => {
      const name = a.getAttribute('href').split('/').pop();
      if (!data.pdfs[name]) return;
      const url = URL.createObjectURL(new Blob([unb64(data.pdfs[name])], { type: 'application/pdf' }));
      a.href = url;
      a.setAttribute('download', name);
      a.removeAttribute('onclick');
    });
    $('lockScreen').style.display = 'none';
    room.style.display = 'block';
  }

  async function unlock() {
    const input = $('passInput');
    const error = $('lockError');
    const btn = document.querySelector('.lock-btn');
    error.textContent = '';
    btn.disabled = true;
    btn.textContent = 'VERIFYING...';
    try {
      const raw = await deriveRaw(input.value.trim());
      await open(raw);
      try { sessionStorage.setItem(KEY_STORE, btoa(String.fromCharCode(...raw))); } catch (e) {}
    } catch (e) {
      error.textContent = 'Invalid access code. Contact contact@quantarnetwork.com';
      input.value = '';
      input.focus();
      const box = document.querySelector('.lock-box');
      box.style.animation = 'none';
      box.offsetHeight;
      box.style.animation = 'shake 0.4s ease';
    } finally {
      btn.disabled = false;
      btn.textContent = 'AUTHENTICATE';
    }
  }

  window.unlock = unlock;
  $('passInput').addEventListener('keydown', (e) => { if (e.key === 'Enter') unlock(); });

  try {
    const saved = sessionStorage.getItem(KEY_STORE);
    if (saved) open(unb64(saved)).catch(() => { try { sessionStorage.removeItem(KEY_STORE); } catch (e) {} });
  } catch (e) {}

  const style = document.createElement('style');
  style.textContent = '@keyframes shake { 0%,100%{transform:translateX(0)} 20%,60%{transform:translateX(-8px)} 40%,80%{transform:translateX(8px)} }';
  document.head.appendChild(style);
})();
</script>
